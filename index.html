document.querySelector('form').addEventListener('submit',async event=>{
event.preventDefault();const button=document.querySelector('button'),status=document.querySelector('#status');

try{

const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
const html=new TextDecoder().decode(decrypted);document.open();document.write(html);document.close();
}catch(error){status.textContent='パスワードを確認して、もう一度お試しください。';button.disabled=false;}
});
