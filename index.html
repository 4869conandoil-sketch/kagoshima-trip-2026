    // チェック状態の管理
    let checkedItems = JSON.parse(localStorage.getItem('kagoshima_checklist_v2') || '{}');
    let currentTab = 'spots';
    let currentDayFilter = 'all'; // 'all' | 1 | 2

    function toggleCheck(id) {
      checkedItems[id] = !checkedItems[id];
      localStorage.setItem('kagoshima_checklist_v2', JSON.stringify(checkedItems));
      
      const el = document.getElementById(`check-box-${id}`);
      const textEl = document.getElementById(`check-text-${id}`);
      if (el && textEl) {
        if (checkedItems[id]) {
          el.className = el.className.includes('circle') 
            ? "ph-fill ph-check-circle text-satsuma-red text-2xl shrink-0"
            : "ph-fill ph-check-square text-satsuma-red text-lg shrink-0";
          textEl.classList.add('line-through', 'text-slate-400');
        } else {
          el.className = el.className.includes('circle')
            ? "ph-bold ph-circle text-slate-300 text-2xl shrink-0"
            : "ph-bold ph-square text-slate-300 text-lg shrink-0";
          textEl.classList.remove('line-through', 'text-slate-400');
        }
      }
    }

    function setDayFilter(day) {
      currentDayFilter = day;
      renderContent();
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      const tabs = ['spots', 'drive', 'food', 'souvenir'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tabKey) {
          btn.className = "flex-1 flex flex-col items-center py-1 text-satsuma-red font-bold transition-colors";
        } else {
          btn.className = "flex-1 flex flex-col items-center py-1 text-slate-400 font-medium transition-colors";
        }
      });

      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ナビ用ディープリンク作成ヘルパー
    function generateNavButtons(name, lat, lng, address) {
      const q = encodeURIComponent(name || address);
      const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
      const yahooNavUrl = (lat && lng) 
        ? `yjcarnavi://navi/select?lat=${lat}&lon=${lng}&name=${q}` 
        : `https://map.yahoo.co.jp/search?q=${q}`;
      const appleMapUrl = `https://maps.apple.com/?q=${q}`;

      return `
        <a href="${googleMapUrl}" target="_blank" rel="noopener noreferrer"
           class="flex flex-col items-center justify-center py-2 px-1 bg-white rounded-xl border border-slate-200 text-slate-700 hover:border-blue-400 active:scale-95 transition-all shadow-xs">
          <i class="ph-bold ph-google-logo text-blue-600 text-lg mb-0.5"></i>
          <span class="text-[10px] font-bold">Googleマップ</span>
        </a>
        <a href="${yahooNavUrl}" target="_blank" rel="noopener noreferrer"
           class="flex flex-col items-center justify-center py-2 px-1 bg-white rounded-xl border border-slate-200 text-slate-700 hover:border-red-400 active:scale-95 transition-all shadow-xs">
          <i class="ph-bold ph-car text-red-500 text-lg mb-0.5"></i>
          <span class="text-[10px] font-bold">Yahoo!カーナビ</span>
        </a>
        <a href="${appleMapUrl}" target="_blank" rel="noopener noreferrer"
           class="flex flex-col items-center justify-center py-2 px-1 bg-white rounded-xl border border-slate-200 text-slate-700 hover:border-slate-400 active:scale-95 transition-all shadow-xs">
          <i class="ph-bold ph-apple-logo text-slate-800 text-lg mb-0.5"></i>
          <span class="text-[10px] font-bold">Appleマップ</span>
        </a>
      `;
    }

    // メイン描画処理
    function renderContent() {
      const container = document.getElementById('content-container');
      container.innerHTML = '';

      if (currentTab === 'spots' || currentTab === 'food') {
        renderGridCards(container, currentTab);
      } else if (currentTab === 'drive') {
        renderDriveList(container);
      } else if (currentTab === 'souvenir') {
        renderSouvenirList(container);
      }
    }

    // 【1】名所＆食事・宿：サムネイルグリッドUI（Day1 / Day2 フィルター付き）
    function renderGridCards(container, tabKey) {
      const rawList = KAGOSHIMA_DATA[tabKey] || [];
      const list = currentDayFilter === 'all' 
        ? rawList 
        : rawList.filter(item => item.day === currentDayFilter);

      // 日程フィルターピル（名所タブのみ表示）
      if (tabKey === 'spots') {
        const filterBar = document.createElement('div');
        filterBar.className = "flex items-center gap-1.5 bg-white p-1.5 rounded-2xl shadow-xs border border-amber-900/10";
        const filters = [
          { key: 'all', label: 'すべて (15)' },
          { key: 1, label: '1日目: 霧島・桜島 (5)' },
          { key: 2, label: '2日目: 指宿・知覧・市内 (10)' }
        ];
        filterBar.innerHTML = filters.map(f => {
          const active = currentDayFilter === f.key;
          return `
            <button onclick="setDayFilter(${typeof f.key === 'string' ? `'${f.key}'` : f.key})"
              class="flex-1 py-1.5 px-2 rounded-xl text-[11px] font-bold transition-all ${active ? 'bg-satsuma-red text-white shadow-xs' : 'text-slate-500 hover:bg-slate-100'}">
              ${f.label}
            </button>
          `;
        }).join('');
        container.appendChild(filterBar);
      }

      // ガイド見出し
      const titleBar = document.createElement('div');
      titleBar.className = "flex items-center justify-between px-1";
      titleBar.innerHTML = `
        <span class="text-xs font-bold text-slate-600">
          ${tabKey === 'spots' ? '🌋 訪問スポット（タップで詳細＆動画）' : '🍲 宿泊・砂むし温泉・食事スポット'}
        </span>
        <span class="text-[10px] bg-red-100 text-satsuma-red px-2 py-0.5 rounded-full font-bold">
          ${list.length} 件
        </span>
      `;
      container.appendChild(titleBar);

      // 2カラムグリッド（モバイルで押しやすい大判サムネイル）
      const grid = document.createElement('div');
      grid.className = tabKey === 'food' ? "grid grid-cols-1 gap-3" : "grid grid-cols-2 gap-3";

      list.forEach(spot => {
        const item = document.createElement('div');
        item.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-amber-900/10 cursor-pointer active:scale-98 transition-all hover:shadow-md flex flex-col";
        item.onclick = () => openModal(spot);

        const hasVideo = spot.youtubeList && spot.youtubeList.length > 0;

        item.innerHTML = `
          <div class="relative w-full ${tabKey === 'food' ? 'h-40' : 'h-32'} bg-slate-200 overflow-hidden">
            <img src="${spot.image}" alt="${spot.name}" class="w-full h-full object-cover"
                 onerror="this.onerror=null; if('${spot.fallbackImage || ''}') this.src='${spot.fallbackImage}';">
            <div class="absolute top-2 left-2 flex items-center gap-1">
              <span class="bg-slate-900/80 text-amber-300 text-[9px] font-extrabold px-1.5 py-0.5 rounded">
                Day${spot.day}
              </span>
              <span class="bg-black/60 backdrop-blur-xs text-white text-[9px] font-bold px-2 py-0.5 rounded">
                ${spot.category}
              </span>
            </div>
            ${hasVideo ? `
              <span class="absolute top-2 right-2 bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5 shadow">
                <i class="ph-fill ph-youtube-logo"></i>
                <span>動画×${spot.youtubeList.length}</span>
              </span>
            ` : ''}
            <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent px-2.5 pt-4 pb-1.5">
              <span class="text-[10px] text-amber-200 font-bold block truncate">${spot.timePlan || ''}</span>
            </div>
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="text-xs font-extrabold text-slate-800 line-clamp-1">${spot.name}</h3>
              <p class="text-[10px] text-slate-500 line-clamp-2 mt-0.5 leading-snug">${spot.subtitle || spot.address}</p>
            </div>
            <div class="mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[10px] text-satsuma-red font-bold">
              <span>詳細・ナビ</span>
              <i class="ph-bold ph-arrow-right text-xs"></i>
            </div>
          </div>
        `;
        grid.appendChild(item);
      });

      container.appendChild(grid);
    }

    // ==========================================
    // モーダル（詳細シート）の展開・複数YouTube動画切替
    // ==========================================
    // モーダル（詳細シート）の展開・リッチYouTubeカード表示
    // ==========================================
    function openModal(spot) {
      document.getElementById('modal-title').textContent = spot.name;
      document.getElementById('modal-address').querySelector('span').textContent = spot.address;
      document.getElementById('modal-category').textContent = spot.category;
      document.getElementById('modal-day-badge').textContent = `Day ${spot.day} (${spot.day === 1 ? '12/3 木' : '12/4 金'})`;
      document.getElementById('modal-time-badge').textContent = spot.timePlan || '';
      
      const modalImg = document.getElementById('modal-image');
      modalImg.src = spot.image;
      modalImg.onerror = () => {
        modalImg.onerror = null;
        if (spot.fallbackImage) modalImg.src = spot.fallbackImage;
      };

      document.getElementById('modal-description').textContent = spot.description;

      // 駐車場情報
      const parkingEl = document.getElementById('modal-parking');
      if (spot.parking) {
        parkingEl.classList.remove('hidden');
        parkingEl.querySelector('span').textContent = `【駐車・経路】${spot.parking}`;
      } else {
        parkingEl.classList.add('hidden');
      }

      // 電話発信ボタン
      const phoneContainer = document.getElementById('modal-phone-btn');
      if (spot.phone) {
        phoneContainer.innerHTML = `
          <a href="tel:${spot.phone}" class="inline-flex items-center gap-1 text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">
            <i class="ph-fill ph-phone"></i>
            <span>${spot.phone}</span>
          </a>
        `;
      } else {
        phoneContainer.innerHTML = '';
      }

      // カーナビボタン
      const navContainer = document.getElementById('modal-nav-buttons');
      navContainer.innerHTML = generateNavButtons(spot.name, spot.lat, spot.lng, spot.address);

      // チェックリスト
      const checkContainer = document.getElementById('modal-checklist-container');
      checkContainer.innerHTML = '';
      if (spot.checklist && spot.checklist.length > 0) {
        checkContainer.innerHTML = `
          <div class="text-xs font-bold text-slate-700 flex items-center gap-1 mt-2">
            <i class="ph-bold ph-check-square-offset text-satsuma-red"></i>
            <span>優先ポイント・ミッション</span>
          </div>
          <div class="bg-slate-50 rounded-xl p-2.5 space-y-2 border border-slate-100">
            ${spot.checklist.map(c => {
              const isChecked = !!checkedItems[c.id];
              return `
                <div class="flex items-start gap-2 cursor-pointer select-none" onclick="toggleCheck('${c.id}')">
                  <i id="check-box-${c.id}" class="${isChecked ? 'ph-fill ph-check-square text-satsuma-red' : 'ph-bold ph-square text-slate-300'} text-lg shrink-0 mt-0.5"></i>
                  <span id="check-text-${c.id}" class="text-xs text-slate-700 leading-snug ${isChecked ? 'line-through text-slate-400' : ''}">${c.text}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // YouTube（タイトル・サムネイル付き動画カード ＆ アプリ直行）
      const ytContainer = document.getElementById('modal-youtube-container');
      ytContainer.innerHTML = '';
      const videos = spot.youtubeList || [];

      if (videos.length > 0) {
        ytContainer.innerHTML = `
          <div class="text-xs font-bold text-slate-700 flex items-center justify-between mt-3 mb-1.5">
            <span class="flex items-center gap-1">
              <i class="ph-fill ph-youtube-logo text-rose-600 text-base"></i>
              <span>参考YouTube動画（${videos.length}本・タップで再生）</span>
            </span>
            <span class="text-[10px] text-slate-500">YouTubeアプリ起動</span>
          </div>
          <div class="space-y-2.5">
            ${videos.map((v, idx) => `
              <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener noreferrer"
                 class="group block bg-slate-50 hover:bg-rose-50/40 rounded-2xl p-2 border border-slate-200 hover:border-rose-300 transition-all active:scale-98 shadow-xs">
                <div class="flex gap-2.5 items-center">
                  <!-- サムネイル画像 -->
                  <div class="relative w-28 h-18 bg-black rounded-xl overflow-hidden shrink-0 shadow-inner">
                    <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="${v.title}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/25 flex items-center justify-center group-hover:bg-black/10 transition-colors">
                      <div class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center shadow-md">
                        <i class="ph-fill ph-play text-xs ml-0.5"></i>
                      </div>
                    </div>
                  </div>
                  <!-- タイトルと見どころ解説 -->
                  <div class="flex-1 min-w-0 pr-1">
                    <span class="inline-block text-[9px] font-bold text-rose-700 bg-rose-100/70 px-1.5 py-0.5 rounded">
                      ${v.tag || `動画 ${idx + 1}`}
                    </span>
                    <h4 class="text-xs font-extrabold text-slate-900 group-hover:text-rose-600 line-clamp-2 mt-0.5 leading-snug transition-colors">
                      ${v.title}
                    </h4>
                    ${v.note ? `<p class="text-[10px] text-slate-500 line-clamp-1 mt-1">💡 ${v.note}</p>` : ''}
                  </div>
                </div>
              </a>
            `).join('')}
          </div>
        `;
      }

      // 関連Webサイトリンク
      const linkContainer = document.getElementById('modal-links-container');
      linkContainer.innerHTML = '';
      if (spot.links && spot.links.length > 0) {
        linkContainer.innerHTML = `
          <div class="text-xs font-bold text-slate-700 mt-3 mb-1">公式・関連Webサイト</div>
          <div class="flex flex-wrap gap-2">
            ${spot.links.map(l => `
              <a href="${l.url}" target="_blank" rel="noopener noreferrer" 
                 class="inline-flex items-center gap-1 text-[11px] font-bold text-satsuma-deepRed bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-xl border border-red-200">
                <i class="ph-bold ph-arrow-square-out"></i>
                <span>${l.title}</span>
              </a>
            `).join('')}
          </div>
        `;
      }

      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      document.body.style.overflow = '';
      document.getElementById('modal-youtube-container').innerHTML = '';
    }

    document.getElementById('detail-modal').addEventListener('click', (e) => {
      if (e.target.id === 'detail-modal') {
        closeModal();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderContent();
    });
  </script>
</body>
</html>
